<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="css">
:root{--p:#5b2ed6;--p2:#7c5cf0;--pl:#ece7fd;--bg:#efeef5;--card:#fff;--tx:#17151f;--mu:#77738a;--ok:#22a861;--bad:#e5484d;--org:#f59e0b;--blue:#3b82f6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Plus Jakarta Sans',system-ui,sans-serif}
body{padding-bottom:110px}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}
h1{font-size:28px;margin:0;font-weight:800;letter-spacing:-.5px}
h2{font-size:13px;margin:22px 4px 10px;color:var(--mu);font-weight:700;letter-spacing:.8px;text-transform:uppercase}
h3{font-size:17px;margin:0 0 4px;font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;padding:22px 0 6px}
.card{background:var(--card);border-radius:24px;padding:18px;margin-bottom:12px;box-shadow:0 2px 10px rgba(30,20,70,.05)}
.mu{color:var(--mu);font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.row>.f{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--pl);color:var(--p);border-radius:999px;padding:7px 12px;font-weight:700;font-size:13px}
.big{font-size:34px;font-weight:800;letter-spacing:-1px}
.cd{font-size:30px;font-weight:800;color:var(--p);letter-spacing:-.5px}
.bar{height:10px;background:var(--pl);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--p2));border-radius:99px}
.alert{background:#fff6e6;color:#8a5300;border-radius:18px;padding:12px 14px;font-size:14px;margin-bottom:10px;font-weight:600}
button{font-family:inherit;cursor:pointer;border:0}
.btn{background:var(--p);color:#fff;border-radius:999px;padding:16px 22px;font-size:17px;font-weight:700;width:100%;box-shadow:0 8px 24px rgba(91,46,214,.3)}
.btn:disabled{opacity:.4}
.btn.dark{background:#0d0c12;box-shadow:none}
.btn.sec{background:var(--pl);color:var(--p);box-shadow:none}
.btn.sm{padding:10px 14px;font-size:14px;width:auto}
.link{background:none;color:var(--mu);font-weight:600;font-size:15px;padding:10px}
.x{background:none;color:var(--mu);font-size:16px;padding:4px 8px}
input,select,textarea{font-family:inherit;width:100%;padding:14px 16px;border:1.5px solid #dcd8e8;border-radius:16px;font-size:17px;background:#fff;color:var(--tx);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--p)}
label.l{font-size:12px;color:var(--mu);display:block;margin:0 0 6px 4px;font-weight:600}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:2px solid transparent;border-radius:999px;padding:18px 22px;font-size:18px;font-weight:500;color:var(--tx);margin-bottom:12px;box-shadow:0 2px 8px rgba(30,20,70,.05)}
.opt.on{border-color:var(--p);background:var(--pl);color:var(--p);font-weight:700}
.opt .ck{margin-left:auto;opacity:0}.opt.on .ck{opacity:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:999px;background:#fff;border:1.5px solid #dcd8e8;color:var(--tx);font-size:14px;font-weight:600}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
ul{list-style:none;margin:0;padding:0}
li.it{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f0eef5;font-size:15px}
li.it:last-child{border:0}
.tl{position:relative;padding-left:22px}
.tl:before{content:'';position:absolute;left:6px;top:20px;bottom:0;width:2px;background:#e6e3ee}
.tl:last-child:before{display:none}
.dot{position:absolute;left:0;top:16px;width:14px;height:14px;border-radius:50%;background:var(--ok);border:3px solid #fff;box-shadow:0 0 0 1px #e6e3ee}
nav{position:fixed;left:16px;bottom:18px;display:flex;gap:4px;background:#fff;border-radius:999px;padding:6px;box-shadow:0 8px 30px rgba(30,20,70,.15);z-index:5}
nav button{width:48px;height:48px;border-radius:50%;background:none;color:#9b97ab;display:flex;align-items:center;justify-content:center}
nav button.on{background:var(--pl);color:var(--p)}
.fab{position:fixed;right:20px;bottom:22px;width:64px;height:64px;border-radius:50%;background:#0d0c12;color:#fff;font-size:34px;font-weight:300;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:5}
.ov{position:fixed;inset:0;background:rgba(15,10,30,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:28px 28px 0 0;padding:14px 18px 28px;max-height:92vh;overflow:auto}
.grab{width:44px;height:5px;border-radius:9px;background:#cfcbe0;margin:0 auto 14px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;border-radius:20px;padding:16px 6px;font-weight:700;font-size:13px;color:var(--tx)}
.act span{font-size:26px}
/* onboarding */
.ob{min-height:100vh;display:flex;flex-direction:column;padding:16px 18px 24px;max-width:520px;margin:0 auto}
.ob .back{background:none;font-size:30px;color:var(--tx);padding:4px 8px;align-self:flex-start;height:44px}
.prog{height:5px;background:#dcd8e8;border-radius:9px;margin:4px 0 18px;overflow:hidden}.prog i{display:block;height:100%;background:var(--p);border-radius:9px;transition:width .3s}
.ask{display:flex;gap:12px;align-items:flex-start;margin:6px 0 26px}
.bub{background:#fff;border-radius:22px;padding:16px 20px;font-size:24px;font-weight:700;line-height:1.2;position:relative;flex:1;box-shadow:0 2px 10px rgba(30,20,70,.05)}
.bub:before{content:'';position:absolute;left:-9px;top:24px;border:10px solid transparent;border-right-color:#fff;border-left:0}
.ob .body{flex:1}
.ob .foot{position:sticky;bottom:0;padding-top:12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.ob .foot .btn{max-width:300px}
.huge{font-size:72px;font-weight:800;text-align:center;letter-spacing:-2px;margin-top:30px}
.huge small{font-size:30px;color:var(--mu);font-weight:600;margin-left:6px}
input[type=range]{padding:0;border:0;accent-color:var(--p);height:40px}
.center{text-align:center}
.fade{animation:fd .35s ease}@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bmi{height:12px;border-radius:99px;background:linear-gradient(90deg,#3b82f6 0%,#3b82f6 11%,#22a861 11%,#22a861 33%,#f5c518 33%,#f5c518 50%,#f59e0b 50%,#f59e0b 67%,#e5484d 67%);position:relative;margin:14px 0 6px}
.bmi i{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:#fff;border:5px solid var(--org);transform:translate(-50%,-50%)}
.tag{display:inline-block;border-radius:8px;padding:3px 8px;font-size:11px;font-weight:800;background:#fdecec;color:var(--bad)}
.tog{display:inline-flex;background:#f1eff7;border-radius:99px;padding:3px}.tog button{background:none;padding:6px 12px;border-radius:99px;font-weight:700;font-size:13px;color:var(--mu)}.tog button.on{background:#0d0c12;color:#fff}
svg{display:block}
.center svg,.huge svg{margin:0 auto}
.bub.np:before{display:none}
.huge{display:flex;align-items:baseline;justify-content:center}

.msgs{display:flex;flex-direction:column;gap:10px;padding-bottom:150px}
.msg{max-width:85%;padding:12px 15px;border-radius:20px;font-size:15px;line-height:1.45}
.msg.u{align-self:flex-end;background:var(--p);color:#fff;border-bottom-right-radius:6px}
.msg.a{align-self:flex-start;background:#fff;border-bottom-left-radius:6px;box-shadow:0 2px 8px rgba(30,20,70,.05)}
.msg ul{padding-left:18px;margin:4px 0;list-style:disc}.msg li{margin:2px 0}
.composer{position:fixed;left:0;right:0;bottom:86px;z-index:4;padding:0 16px}
.composer .in{max-width:520px;margin:0 auto;display:flex;gap:8px;background:#fff;border-radius:999px;padding:6px 6px 6px 16px;box-shadow:0 6px 24px rgba(30,20,70,.12)}
.composer input{border:0;padding:10px 4px;font-size:16px}
.composer button{width:46px;height:46px;border-radius:50%;background:var(--p);color:#fff;font-size:20px;flex:0 0 auto}
#st-msg{font-size:12px;color:var(--mu);text-align:center;margin-top:8px}
</style>
</head>

<script type="application/json" id="st">{"v":3,"onb":false,"name":"","prof":{"sex":"M","age":40,"h":170,"act":1.2,"target":70,"rate":0.5},"tr":{"stage":"start","med":"","mg":"","freq":7},"worries":[],"meals":[],"water":{},"doses":[],"inv":{"n":0,"exp":""},"weights":[],"sym":[],"hc":{"on":false},"notif":true,"key":"","_t":0}</script>
<script id="code">
(function(){
var CODE=document.getElementById('code').textContent, CSS=document.getElementById('css').textContent; // render() reemplaza el body
var S=JSON.parse(document.getElementById('st').textContent), DEF=JSON.parse(JSON.stringify(S));
try{ var ls=JSON.parse(localStorage.getItem('mt-state')||'null'); if(ls&&ls._t>(S._t||0)) S=ls; }catch(e){}
// Migración desde versiones anteriores
if(S.dose&&!S.tr){ S.tr={stage:'using',med:S.dose.med||'',mg:S.dose.mg||'',freq:S.dose.freq||7}; }
for(var key in DEF) if(S[key]==null) S[key]=DEF[key];
if(S.v!==3){ S.v=3; S.onb=false; }

var chat=[];try{chat=JSON.parse(localStorage.getItem('mt-chat')||'[]');}catch(e){}
var llm=null,busy=false;
/* ---------- Capa nativa (Android / iOS) ---------- */
var NATIVE=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
var Health=NATIVE?Capacitor.registerPlugin('Health'):null, AppP=NATIVE?Capacitor.registerPlugin('App'):null, LN=NATIVE?Capacitor.registerPlugin('LocalNotifications'):null;
var hcBusy=false, hcErr='';
function persist(){S._t=Date.now();try{localStorage.setItem('mt-state',JSON.stringify(S));}catch(e){}if(!modal&&S.onb)render();}
// IA con la clave de Anthropic del usuario (se guarda solo en este teléfono)
function claudeCall(messages,max){
  return fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:max||800,messages:messages})})
   .then(function(r){return r.json().then(function(j){if(!r.ok)throw{code:r.status===429?'rate_limited':'api',message:(j.error&&j.error.message)||String(r.status)};return (j.content||[]).map(function(c){return c.text||'';}).join('');});});
}
function imgB64(file){ // reduce la foto a 1024 px para enviarla rápido
  return new Promise(function(res,rej){var u=URL.createObjectURL(file),im=new Image();im.onload=function(){var k=Math.min(1,1024/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.82).split(',')[1]);};im.onerror=rej;im.src=u;});
}
function makeLLM(){
  var f=function(msgs,o){return claudeCall(msgs,800).then(function(t){if(o&&o.onText)o.onText({text:t});return{text:t};});};
  f.json=function(prompt,o){var imgs=(o&&o.images)||[];return Promise.all(imgs.map(imgB64)).then(function(bs){
      var content=bs.map(function(b){return{type:'image',source:{type:'base64',media_type:'image/jpeg',data:b}};}).concat([{type:'text',text:prompt}]);
      return claudeCall([{role:'user',content:content}],400);}).then(function(t){var m=t.match(/\{[\s\S]*\}/);if(!m)throw{code:'parse'};return JSON.parse(m[0]);});};
  f.limits=function(){return Promise.resolve({images:true});};
  return f;
}
// Health Connect / Apple Salud: peso (báscula), pasos, calorías activas, frecuencia cardiaca, grasa corporal, entrenamientos
var HC_READ=['weight','steps','calories','heartRate','restingHeartRate','bodyFat','workouts'];
function iso(d){return d.toISOString();}
function dayStart(){var d=new Date();d.setHours(0,0,0,0);return d;}
function hcConnect(){
  if(!Health)return;hcErr='';
  Health.isAvailable().then(function(a){if(!a.available)throw{message:'Health Connect no está disponible en este teléfono'+(a.reason?' ('+a.reason+')':'')+'. Instálalo desde la Play Store.'};return Health.requestAuthorization({read:HC_READ,requestHistoryAccess:true});})
   .then(function(st){S.hc=S.hc||{};S.hc.on=(st.readAuthorized||[]).length>0;S.hc.granted=st.readAuthorized||[];if(!S.hc.on)hcErr='No diste permisos. Puedes activarlos en Ajustes de Health Connect.';persist();return hcSync();})
   .catch(function(e){hcErr=(e&&e.message)||'No se pudo conectar.';persist();});
}
function hcSync(){
  if(!Health||!S.hc||!S.hc.on||hcBusy)return Promise.resolve();
  hcBusy=true;var now=new Date(),d0=dayStart(),since=new Date(now-180*864e5),w0=new Date(d0-7*864e5);
  var safe=function(p){return p.then(function(x){return x;},function(){return null;});};
  return Promise.all([
    safe(Health.readSamples({dataType:'weight',startDate:iso(since),endDate:iso(now),limit:1000,ascending:true})),
    safe(Health.queryAggregated({dataType:'steps',startDate:iso(d0),endDate:iso(now),bucket:'day',aggregation:'sum'})),
    safe(Health.queryAggregated({dataType:'calories',startDate:iso(d0),endDate:iso(now),bucket:'day',aggregation:'sum'})),
    safe(Health.queryAggregated({dataType:'calories',startDate:iso(w0),endDate:iso(d0),bucket:'day',aggregation:'sum'})),
    safe(Health.readSamples({dataType:'restingHeartRate',startDate:iso(new Date(now-7*864e5)),endDate:iso(now),limit:5})),
    safe(Health.readSamples({dataType:'heartRate',startDate:iso(new Date(now-6*36e5)),endDate:iso(now),limit:1})),
    safe(Health.readSamples({dataType:'bodyFat',startDate:iso(since),endDate:iso(now),limit:1})),
    safe(Health.queryWorkouts({startDate:iso(d0),endDate:iso(now),limit:20}))
  ]).then(function(r){
    if(r[0]&&r[0].samples){var byDay={};r[0].samples.forEach(function(x){byDay[dstr(new Date(x.startDate))]=Math.round(x.value*10)/10;});
      Object.keys(byDay).forEach(function(day){var ex=S.weights.filter(function(w){return w.d===day;})[0];if(!ex||ex.kg!==byDay[day]){S.weights=S.weights.filter(function(w){return w.d!==day;});S.weights.push({d:day,kg:byDay[day],src:'hc'});}});}
    var sum=function(x){return x&&x.samples&&x.samples.length?Math.round(x.samples.reduce(function(a,y){return a+(y.value||0);},0)):null;};
    var wk=r[3]&&r[3].samples?r[3].samples.filter(function(y){return y.value>0;}):[];
    S.hc.day={date:today(),steps:sum(r[1]),active:sum(r[2]),rhr:r[4]&&r[4].samples[0]?Math.round(r[4].samples[0].value):null,hr:r[5]&&r[5].samples[0]?Math.round(r[5].samples[0].value):null,
      workouts:r[7]&&r[7].workouts?r[7].workouts.map(function(w){return{t:w.workoutType,min:Math.round(w.duration/60),kcal:Math.round(w.totalEnergyBurned||0)};}):[]};
    S.hc.avgActive=wk.length?Math.round(wk.reduce(function(a,y){return a+y.value;},0)/wk.length):(S.hc.day.active||0);
    if(r[6]&&r[6].samples[0])S.hc.fat=Math.round(r[6].samples[0].value*10)/10;
    S.hc.last=Date.now();hcErr='';
  }).catch(function(e){hcErr=(e&&e.message)||'Error al sincronizar';}).then(function(){hcBusy=false;persist();});
}
function ago(t){if(!t)return'nunca';var m=Math.round((Date.now()-t)/6e4);return m<1?'justo ahora':m<60?'hace '+m+' min':'hace '+Math.round(m/60)+' h';}
// Recordatorios locales: dosis y registro de comidas
function scheduleReminders(){
  if(!LN)return;
  LN.cancel({notifications:[{id:1},{id:2}]}).catch(function(){}).then(function(){
    if(!S.notif)return;
    var list=[],n=nextDoseAt();
    if(n&&n>new Date())list.push({id:1,title:'Hora de tu aplicación 💉',body:(S.tr.med||'Tu dosis')+' · sitio sugerido: '+nextSite(),schedule:{at:n,allowWhileIdle:true}});
    list.push({id:2,title:'¿Ya registraste tus comidas? 🍽️',body:'Escríbelas en Mi Tracker y te calculo las calorías.',schedule:{on:{hour:20,minute:0},allowWhileIdle:true}});
    return LN.schedule({notifications:list});
  }).catch(function(){});
}

function pad(n){return String(n).padStart(2,'0');}
function dstr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function today(){return dstr(new Date());}
function addDays(s,n){var d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return dstr(d);}
function fmt(s){return new Date(s+'T12:00:00').toLocaleDateString('es-CO',{day:'numeric',month:'short'});}
function fmtY(s){return new Date(s+'T12:00:00').toLocaleDateString('es-CO',{day:'numeric',month:'short',year:'numeric'});}
function nowT(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function $(id){return document.getElementById(id);}
function num(v,d){v=parseFloat(String(v).replace(',','.'));return isNaN(v)?d:v;}

function plan(pr,w){
  var useHC=!pr&&S.hc&&S.hc.on&&S.hc.avgActive>0;
  pr=pr||S.prof; w=w||curW();
  var bmr=10*w+6.25*pr.h-5*pr.age+(pr.sex==='F'?-161:5), tdee=useHC?bmr*1.2+0.5*S.hc.avgActive:bmr*pr.act; // con reloj: reposo + la mitad de la actividad medida (los relojes sobreestiman)
  var kcal=Math.round(Math.max(tdee-pr.rate*1100,tdee*0.75));
  var prot=Math.round(1.5*pr.target), fat=Math.round(kcal*0.30/9), carb=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
  var h2=Math.pow(pr.h/100,2), weeks=Math.max(0,(w-pr.target)/pr.rate);
  return {tdee:Math.round(tdee),kcal:kcal,prot:prot,fat:fat,carb:carb,fib:pr.sex==='F'?25:30,water:Math.round(w*35/100)/10,bmi:w/h2,bmiT:pr.target/h2,eta:addDays(today(),Math.round(weeks*7)),lose:Math.max(0,w-pr.target),hc:useHC};
}

function level(at){var hl=medInfo(S.tr.med)[2],t=at.getTime(),s=0;S.doses.forEach(function(x){var dt=(t-new Date(x.d+'T'+(x.t||'08:00')+':00').getTime())/864e5;if(dt>=0)s+=num(x.mg,0)*Math.pow(.5,dt/hl);});return s;}
function levelChart(days){

  if(m==='menu') h='<h3 style="margin-bottom:14px">¿Qué quieres registrar?</h3><div class="grid3">'+[['meal','🍽️','Comida'],['dose','💉','Aplicación'],['weight','⚖️','Peso'],['sym','🩺','Síntoma'],['water','💧','Agua'],['inv','📦','Inventario']].map(function(x){return '<button class="act" data-m="'+x[0]+'"><span>'+x[1]+'</span>'+x[2]+'</button>';}).join('')+'</div>';
  if(m==='meal') h='<h3 style="margin-bottom:14px">Agregar comida</h3><div id="ai-box" style="display:'+(ai?'block':'none')+';margin-bottom:12px"><button class="btn sec" id="ai-btn">📷 Calcular con una foto</button><input type="file" id="ai-file" accept="image/*" capture="environment" style="display:none"></div><div class="mu center" id="ai-msg" style="margin:6px 0"></div>'+
    field('¿Qué comiste?','<input id="f-n" placeholder="Ej: 3 huevos cocidos con aguacate">')+'<p class="mu" style="margin:-4px 4px 10px">Deja los números vacíos y se calculan solos.</p><div class="grid2">'+field('Calorías','<input id="f-k" type="number" inputmode="numeric">')+field('Proteína g','<input id="f-p" type="number" inputmode="numeric">')+field('Carbohidratos g','<input id="f-c" type="number" inputmode="numeric">')+field('Grasas g','<input id="f-f" type="number" inputmode="numeric">')+field('Fibra g','<input id="f-fi" type="number" inputmode="numeric">')+'</div><button class="btn" data-act="meal">Agregar</button>';
  if(m==='dose') h='<h3 style="margin-bottom:4px">Registrar aplicación</h3><div class="mu" style="margin-bottom:14px">'+(S.tr.med?esc(S.tr.med)+' '+esc(S.tr.mg)+(S.tr.mg?' mg':''):'Primero configura tu medicamento')+'</div>'+
    (S.tr.med?'<div class="grid2">'+field('Fecha','<input id="f-d" type="date" value="'+t+'">')+field('Hora','<input id="f-t" type="time" value="'+nowT()+'">')+'</div>'+field('Sitio · sugerido: '+nextSite(),'<div class="chips" id="f-s">'+SITES.map(function(s){return '<button class="chip'+(s===nextSite()?' on':'')+'" data-site="'+s+'">'+s+'</button>';}).join('')+'</div>')+'<button class="btn" data-act="dose">Registrar dosis</button>':'<button class="btn" data-m="tr">Configurar tratamiento</button>');
  if(m==='weight') h='<h3 style="margin-bottom:14px">Registrar peso</h3><div class="grid2">'+field('Peso kg','<input id="f-w" type="number" step="0.1" inputmode="decimal" value="'+curW()+'">')+field('Fecha','<input id="f-d" type="date" value="'+t+'">')+'</div><button class="btn" data-act="weight">Guardar</button>';
  if(m==='sym') h='<h3 style="margin-bottom:14px">¿Cómo te sientes?</h3><div class="chips" style="margin-bottom:14px">'+SYMS.map(function(s){return '<button class="chip'+((tmp.sym||[]).indexOf(s[0])>=0?' on':'')+'" data-sym="'+s[0]+'">'+s[1]+' '+s[0]+'</button>';}).join('')+'</div>'+
    field('Intensidad: <b id="f-iv">5</b>/10','<input id="f-i" type="range" min="1" max="10" value="5">')+field('Nota','<textarea id="f-n" rows="2" placeholder="Opcional"></textarea>')+'<button class="btn" data-act="sym">Guardar</button><p class="mu center">Si un síntoma es fuerte o no cede, consulta a tu médico.</p>';
  if(m==='water') h='<h3 style="margin-bottom:14px">Agua</h3><div class="grid3">'+[[250,'Vaso'],[500,'Botella'],[1000,'1 litro']].map(function(x){return '<button class="act" data-water="'+x[0]+'" data-close="1"><span>💧</span>'+x[1]+'<br><span class="mu">'+x[0]+' ml</span></button>';}).join('')+'</div>';
  if(m==='inv') h='<h3 style="margin-bottom:14px">Inventario de la pluma</h3><div class="grid2">'+field('Dosis restantes','<input id="f-n" type="number" inputmode="numeric" value="'+S.inv.n+'">')+field('Caducidad','<input id="f-e" type="date" value="'+S.inv.exp+'">')+'</div><p class="mu">Cada aplicación que registras se descuenta sola.</p><button class="btn" data-act="inv">Guardar</button>';
  if(m==='tr') h='<h3 style="margin-bottom:14px">Mi tratamiento</h3>'+field('Medicamento','<select id="f-m"><option value="">Sin medicamento</option>'+MEDS.map(function(x){return '<option'+(S.tr.med===x[0]?' selected':'')+'>'+x[0]+'</option>';}).join('')+'</select>')+
    '<div class="grid2">'+field('Dosis mg','<input id="f-mg" type="number" step="0.05" inputmode="decimal" value="'+esc(S.tr.mg)+'">')+field('Frecuencia','<select id="f-fr">'+[[1,'Diaria'],[7,'Semanal'],[14,'Cada 2 semanas'],[30,'Mensual']].map(function(o){return '<option value="'+o[0]+'"'+(+S.tr.freq===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select>')+'</div><p class="mu">La dosis la define tu médico.</p><button class="btn" data-act="tr">Guardar</button>';
  return '<div class="ov" data-close="1"><div class="sheet fade"><div class="grab"></div>'+h+'</div></div>';
}

/* ---------- Estimación automática de comidas ---------- */
function estimate(desc){
  return llm.json('Estima la información nutricional de lo que comió una persona en Colombia: "'+desc.replace(/"/g,"'")+'". Si no dice cantidad, asume una porción típica. Suma todos los alimentos mencionados. Responde SOLO JSON: {"nombre":"descripción corta en español con porciones","kcal":entero,"proteina_g":entero,"carbohidratos_g":entero,"grasas_g":entero,"fibra_g":entero}.',{modelTier:'default'});
}
function mealFrom(r,fallback){return{d:today(),n:r.nombre||fallback,k:Math.round(num(r.kcal,0)),p:Math.round(num(r.proteina_g,0)),c:Math.round(num(r.carbohidratos_g,0)),f:Math.round(num(r.grasas_g,0)),fi:Math.round(num(r.fibra_g,0))};}
function quickAdd(desc,msgEl,done){
  if(!llm){modal='meal';render();$('f-n').value=desc;return;}
  msgEl.textContent='Calculando calorías y nutrientes…';
  estimate(desc).then(function(r){var m=mealFrom(r,desc);if(!m.k)throw{};S.meals.push(m);if(done)done();save();})
   .catch(function(e){[].forEach.call(document.querySelectorAll('.sheet button[disabled],#qm'),function(x){x.disabled=false;});msgEl.textContent=e&&e.code==='rate_limited'?'Muchas consultas seguidas, espera un momento.':'No pude calcularlo. Intenta describirlo distinto o ponlo a mano.';});
}

/* ---------- Asistente IA ---------- */
function ctx(){
  var P=plan(),t=today(),ms=S.meals.filter(function(m){return m.d===t;}),sum=function(k){return ms.reduce(function(a,m){return a+(m[k]||0);},0);};
  return 'Usuario: '+S.name+', '+(S.prof.sex==='F'?'mujer':'hombre')+', '+S.prof.age+' años, '+S.prof.h+' cm. Peso actual '+curW()+' kg (inicial '+startW()+'), meta '+S.prof.target+' kg, ritmo '+S.prof.rate+' kg/sem.\n'+
   'Plan diario: '+P.kcal+' kcal, proteína '+P.prot+' g, carbohidratos '+P.carb+' g, grasas '+P.fat+' g, fibra '+P.fib+' g, agua '+P.water+' L. IMC '+P.bmi.toFixed(1)+'.\n'+
   'Tratamiento: '+(S.tr.med?S.tr.med+' '+S.tr.mg+' mg, cada '+S.tr.freq+' días':'sin medicamento')+'. Últimas aplicaciones: '+(S.doses.slice(-4).map(function(x){return x.d+' '+x.site;}).join('; ')||'ninguna')+'.\n'+
   'Síntomas recientes: '+(S.sym.slice(-5).map(function(x){return x.d+': '+(x.s.join(', ')||'ninguno')+(x.i?' ('+x.i+'/10)':'');}).join('; ')||'ninguno')+'.\n'+
   'Hoy ('+t+'): '+sum('k')+' kcal, '+sum('p')+' g proteína, '+((S.water[t]||0)/1000)+' L de agua. Comidas: '+(ms.map(function(m){return m.n;}).join(', ')||'ninguna')+'.';
}
var SYS='Eres Lumi, el asistente de la app Mi Tracker para personas en tratamiento para bajar de peso (incluidos medicamentos GLP-1). Responde en español de Colombia, cálido y directo, en máximo 120 palabras, con viñetas cortas si ayudan. Usa los datos del usuario cuando sirvan. No eres médico: nunca indiques, cambies ni ajustes dosis de medicamentos; para eso remite a su médico. Ante señales de alarma (dolor abdominal fuerte y persistente, dolor que va a la espalda, vómitos que no ceden, signos de deshidratación, reacción alérgica) dile que busque atención médica de inmediato. Da ideas prácticas de comidas altas en proteína con alimentos comunes en Colombia cuando pregunten por comida.';
function mdLite(t){
  var h=esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  var out='',inL=false;h.split('\n').forEach(function(l){var m=l.match(/^\s*[-•*]\s+(.*)/);if(m){if(!inL){out+='<ul>';inL=true;}out+='<li>'+m[1]+'</li>';}else{if(inL){out+='</ul>';inL=false;}out+=l?l+'<br>':'<br>';}});
  if(inL)out+='</ul>';return out.replace(/(<br>)+$/,'');
}
var SUGG=['¿Qué ceno hoy con la proteína que me falta?','¿Cómo manejo las náuseas?','Ideas de desayuno alto en proteína','¿Voy bien con mi plan?'];
function vIA(){
  return '<div class="top"><div class="row">'+owl(46)+'<div><h1 style="font-size:24px">Lumi</h1><div class="mu">Tu asistente con IA</div></div></div>'+(chat.length?'<button class="btn sec sm" data-act="clearchat">Nueva</button>':'')+'</div>'+
   (llm?'':'<div class="alert">'+(NATIVE?'Para usar a Lumi, agrega tu clave de IA en Mi plan → Conexiones.':'El asistente no está disponible en esta vista. Abre la app desde Claude para usarlo.')+'</div>')+
   '<div class="msgs" id="msgs">'+(chat.length?'':'<div class="msg a">¡Hola, '+esc(S.name)+'! Puedo ayudarte con comidas, proteína, síntomas, hidratación o cómo vas con tu plan. ¿Qué necesitas?</div><div class="chips" style="margin-top:6px">'+SUGG.map(function(q){return '<button class="chip" data-q="'+esc(q)+'">'+esc(q)+'</button>';}).join('')+'</div>')+
   chat.map(function(m,i){return '<div class="msg '+(m.role==='user'?'u':'a')+'"'+(i===chat.length-1&&m.role==='assistant'?' id="last"':'')+'>'+(m.role==='user'?esc(m.content):mdLite(m.content||'…'))+'</div>';}).join('')+
   '<p class="mu center" style="font-size:11px">Lumi no reemplaza a tu médico.</p></div>'+
   '<div class="composer"><form class="in" id="chatf"><input id="q" placeholder="Escríbele a Lumi…" autocomplete="off"'+(llm&&!busy?'':' disabled')+'><button type="submit"'+(llm&&!busy?'':' disabled')+'>↑</button></form></div>';
}
function ask(q){
  if(!llm||busy||!q)return;
  busy=true;chat.push({role:'user',content:q});chat.push({role:'assistant',content:''});render();scrollChat();
  var msgs=chat.slice(0,-1).map(function(m,i){return{role:m.role,content:i===0?SYS+'\n\nDatos actuales del usuario:\n'+ctx()+'\n\nMensaje del usuario: '+m.content:m.content};});
  if(chat.length>3) msgs[msgs.length-1].content='(Datos actualizados: '+ctx()+')\n\n'+q;
  llm(msgs,{modelTier:'default',cache:false,onText:function(r){chat[chat.length-1].content=r.text;var el=$('last');if(el){el.innerHTML=mdLite(r.text);scrollChat();}}})
   .then(function(r){chat[chat.length-1].content=r.text;})
   .catch(function(e){chat[chat.length-1].content=e&&e.code==='rate_limited'?'Estoy recibiendo muchas preguntas. Intenta de nuevo en un momento.':'No pude responder ahora. Intenta de nuevo.';})
   .then(function(){busy=false;try{localStorage.setItem('mt-chat',JSON.stringify(chat.slice(-30)));}catch(e){}if(tab==='ia'){render();scrollChat();var i=$('q');if(i)i.focus();}});
}
function scrollChat(){window.scrollTo(0,document.body.scrollHeight);}

/* ---------- Render ---------- */
var TABS={inicio:['home',vInicio],tratamiento:['syr',vTrat],ia:['chat',vIA],progreso:['chart',vProg],perfil:['user',vPerfil]};
if(!TABS[tab])tab='inicio';
function render(){
  clearInterval(tick);
  if(!S.onb){ if(!tmp.name&&step===0&&tmp.w==null) startOnbSilent(); document.body.innerHTML=vOnb(); return; }
  document.body.innerHTML='<div class="wrap fade">'+TABS[tab][1]()+'<div id="st-msg"></div></div>'+
   '<nav>'+Object.keys(TABS).map(function(k){return '<button data-tab="'+k+'" class="'+(k===tab?'on':'')+'">'+IC[TABS[k][0]]+'</button>';}).join('')+'</nav><button class="fab" data-m="menu">+</button>'+(modal?vModal():'');
  [].forEach.call(document.querySelectorAll('nav,.fab'),function(x){x.style.display=(modal||(tab==='ia'&&x.classList.contains('fab')))?'none':'';});
  if($('cd')) tick=setInterval(function(){var c=$('cd');if(c)c.textContent=countdown();},1000);
}
function startOnbSilent(){var p=S.prof;tmp={name:S.name,sex:p.sex,stage:S.tr.stage||'start',med:S.tr.med,mg:S.tr.mg,freq:+S.tr.freq||7,age:p.age,h:p.h,w:curW(),target:p.target,rate:p.rate,act:p.act,worries:(S.worries||[]).slice()};}

document.addEventListener('input',function(e){
  var id=e.target.id;
  if(!S.onb&&id==='ob-in'&&STEPS[step].live) STEPS[step].live(e.target.value);
  if(!S.onb&&id==='ob-in'&&step===1) tmp.name=e.target.value;
  if(id==='f-i') $('f-iv').textContent=e.target.value;
});
document.addEventListener('click',function(e){
  if(e.target.classList&&e.target.classList.contains('ov')){modal=null;tmp.sym=[];render();return;}
  var b=e.target.closest('button,[data-tab]');if(!b)return;
  var d=b.dataset;
  if(d.ob){obNav(+d.ob);return;}
  if(d.o!=null){var s=STEPS[step],k=s.key,v=s.num?+d.o:d.o;
    if(s.multi){tmp[k]=tmp[k]||[];var i=tmp[k].indexOf(v);i>=0?tmp[k].splice(i,1):tmp[k].push(v);} else tmp[k]=v;
    render();return;}
  if(d.tab){tab=d.tab;modal=null;history.replaceState(null,'','#'+tab);render();window.scrollTo(0,0);return;}
  if(d.m){modal=d.m;tmp.sym=[];render();return;}
  if(d.q){ask(d.q);return;}
  if(d.lv){lvlRange=+d.lv;render();return;}
  if(d.del){S[d.del].splice(+d.i,1);save();return;}
  if(d.water){var t=today();S.water[t]=Math.max(0,(S.water[t]||0)+(+d.water));if(d.close)modal=null;save();return;}
  if(d.sym){tmp.sym=tmp.sym||[];var j=tmp.sym.indexOf(d.sym);j>=0?tmp.sym.splice(j,1):tmp.sym.push(d.sym);b.classList.toggle('on');return;}
  if(d.site){[].forEach.call(document.querySelectorAll('[data-site]'),function(x){x.classList.remove('on');});b.classList.add('on');return;}
  if(b.id==='ai-btn'){$('ai-file').click();return;}
  var a=d.act,ok=true;
  if(a==='reonb'){startOnb();return;}
  if(a==='hc'){hcConnect();return;}
  if(a==='hcsync'){hcSync();persist();return;}
  if(a==='hcset'){Health.openHealthConnectSettings().catch(function(){});return;}
  if(a==='hcoff'){S.hc={on:false};save();return;}
  if(a==='notif'){if(S.notif){S.notif=false;save();return;}LN.requestPermissions().then(function(p){S.notif=p.display==='granted';save();}).catch(function(){});return;}
  if(a==='clearchat'){chat=[];try{localStorage.removeItem('mt-chat');}catch(e){}render();return;}
  if(a==='meal'){var n=$('f-n').value.trim(),k=Math.round(num($('f-k').value,0));if(!n)return;if(!k){if(!llm)return;b.disabled=true;quickAdd(n,$('ai-msg'),function(){modal=null;});return;}S.meals.push({d:today(),n:n,k:k,p:Math.round(num($('f-p').value,0)),c:Math.round(num($('f-c').value,0)),f:Math.round(num($('f-f').value,0)),fi:Math.round(num(($('f-fi')||{}).value,0))});}
  else if(a==='dose'){var s=document.querySelector('[data-site].on');S.doses.push({d:$('f-d').value||today(),t:$('f-t').value||nowT(),site:s?s.dataset.site:'',med:S.tr.med,mg:S.tr.mg});S.doses.sort(function(x,y){return (x.d+x.t)<(y.d+y.t)?-1:1;});if(S.inv.n>0)S.inv.n--;if(S.tr.stage==='start')S.tr.stage='using';}
  else if(a==='weight'){var w=num($('f-w').value,0);if(!w)return;var dd=$('f-d').value||today();S.weights=S.weights.filter(function(x){return x.d!==dd;});S.weights.push({d:dd,kg:w});}
  else if(a==='sym'){S.sym.push({d:today(),t:nowT(),s:(tmp.sym||[]).slice(),i:(tmp.sym||[]).length?+$('f-i').value:0,note:$('f-n').value.trim()});tmp.sym=[];}
  else if(a==='inv'){S.inv={n:Math.max(0,Math.round(num($('f-n').value,0))),exp:$('f-e').value,on:true};}
  else if(a==='tr'){var med=$('f-m').value;S.tr={stage:med?(S.doses.length?'using':'start'):'none',med:med,mg:$('f-mg').value,freq:+$('f-fr').value};}
  else ok=false;
  if(ok){modal=null;save();}
});
document.addEventListener('submit',function(e){if(e.target.id==='keyf'){e.preventDefault();var k=$('kin').value.trim();if(k){S.key=k;llm=makeLLM();ai=llm;save();}return;}if(e.target.id==='qf'){e.preventDefault();var v=$('qm').value.trim();if(v){$('qm').disabled=true;quickAdd(v,$('qmsg'));setTimeout(function(){var q=$('qm');if(q)q.disabled=false;},15000);}return;}if(e.target.id!=='chatf')return;e.preventDefault();var q=$('q').value.trim();if(q)ask(q);});
// Foto → Claude estima la comida; el usuario revisa antes de agregar
document.addEventListener('change',function(e){
  if(e.target.id!=='ai-file'||!e.target.files[0])return;
  var msg=$('ai-msg');msg.textContent='Analizando la foto…';
  ai.json('Mira la foto de comida. Identifica qué es y estima la porción visible. Responde SOLO JSON: {"nombre":"descripción corta en español con porción","kcal":entero,"proteina_g":entero,"carbohidratos_g":entero,"grasas_g":entero,"fibra_g":entero}.',{images:[e.target.files[0]]})
   .then(function(r){$('f-n').value=r.nombre||'';$('f-k').value=r.kcal||'';$('f-p').value=r.proteina_g||'';$('f-c').value=r.carbohidratos_g||'';$('f-f').value=r.grasas_g||'';$('f-fi').value=r.fibra_g||'';msg.textContent='Revisa los valores y toca Agregar.';})
   .catch(function(err){msg.textContent=err&&err.code==='rate_limited'?'Demasiadas fotos seguidas, espera un momento.':'No pude analizar la foto. Escríbelo a mano.';});
});

render();
if(NATIVE){
  if(S.key){llm=makeLLM();ai=llm;}
  AppP.addListener('resume',function(){hcSync();});
  hcSync();setInterval(hcSync,10*6e4);
  if(S.notif&&LN)LN.checkPermissions().then(function(p){if(p.display!=='granted')return LN.requestPermissions();}).then(scheduleReminders).catch(function(){});
  render();
} else if(window.claude&&claude.use){
  claude.use('artifact').then(function(a){art=a;});
  claude.use('sample').then(function(s){if(!s)return;llm=s;if(S.onb&&(tab==='ia'||tab==='inicio')&&!modal)render();s.limits().then(function(l){if(l&&l.images){ai=s;var bx=$('ai-box');if(bx)bx.style.display='block';}}).catch(function(){});});
}
})();
</script>
</body>
