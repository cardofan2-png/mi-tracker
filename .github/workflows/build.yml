name: Compilar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci || npm install
      # registerPlugin vive en @capacitor/core; sin esto la app abre en blanco
      - run: cp node_modules/@capacitor/core/dist/capacitor.js www/
      - run: sed -i "s/__VERSION__/1.${{ github.run_number }}/g" www/index.html
      - run: npx cap sync android
      - name: Compilar
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Publicar descarga
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          F=MiTracker-v1.${{ github.run_number }}.apk
          cp android/app/build/outputs/apk/release/app-release.apk $F
          cp $F MiTracker.apk
          gh release delete ultima -y --cleanup-tag || true
          gh release create ultima $F MiTracker.apk --latest -t "Mi Tracker v1.${{ github.run_number }}" -n "Descarga $F en tu Android e instálala."
      - uses: actions/upload-artifact@v4
        with: { name: MiTracker-apk, path: MiTracker.apk }
