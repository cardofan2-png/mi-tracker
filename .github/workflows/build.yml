name: Compilar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci || npm install
      # Loop de diseño: si algo se sale de la pantalla o una ventana no cierra, no se publica el APK
      - name: Probar diseño en todos los tamaños de pantalla
        run: |
          npm i --no-save playwright@1
          npx playwright install --with-deps chromium
          node tests/regresion.mjs && node tests/lector-ia.mjs && node tests/diseno.mjs
      - name: Capturas de los errores de diseño
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: diseno-fallas, path: diseno-fallas/ }
      # registerPlugin vive en @capacitor/core; sin esto la app abre en blanco
      - run: cp node_modules/@capacitor/core/dist/capacitor.js www/
      - run: sed -i "s/__VERSION__/1.${{ github.run_number }}/g" www/index.html
      - run: npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      # AAB para Play Console, firmado con la llave de subida guardada en los secretos de GitHub
      - name: Compilar AAB para Play
        working-directory: android
        env: { KS_B64: '${{ secrets.PLAY_UPLOAD_KEYSTORE }}', PLAY_PASS: '${{ secrets.PLAY_UPLOAD_PASSWORD }}' }
        run: |
          if [ -z "$KS_B64" ]; then
            if [ "$GITHUB_REF" = refs/heads/main ]; then echo "::warning::Faltan los secretos PLAY_UPLOAD_KEYSTORE / PLAY_UPLOAD_PASSWORD: no se genera el AAB"; exit 0; fi
            # rama de prueba: llave temporal solo para comprobar que la firma funciona (ese AAB no se publica)
            PLAY_PASS=prueba123; keytool -genkeypair -keystore "$RUNNER_TEMP/up.jks" -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass $PLAY_PASS -keypass $PLAY_PASS -dname CN=prueba
          else
            # tolera espacios o saltos de línea al pegar desde el celular
            PLAY_PASS=$(printf '%s' "$PLAY_PASS" | tr -d ' \r\n'); printf '%s' "$KS_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/up.jks" 2>/dev/null || true
            keytool -list -keystore "$RUNNER_TEMP/up.jks" -storepass "$PLAY_PASS" -alias upload >/dev/null 2>&1 || { echo "::error::La llave de Play no abre: revisa que PLAY_UPLOAD_KEYSTORE y PLAY_UPLOAD_PASSWORD estén pegados completos"; exit 1; }
          fi
          PLAY_KS="$RUNNER_TEMP/up.jks" PLAY_PASS="$PLAY_PASS" ./gradlew bundleRelease --no-daemon
          rm -f "$RUNNER_TEMP/up.jks"
          keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab | grep -E "Owner|SHA256:" | head -2
      - name: Publicar descarga
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          F=Mokifit-v1.${{ github.run_number }}.apk
          cp android/app/build/outputs/apk/release/app-release.apk $F
          cp $F Mokifit.apk; cp $F MichiSalud.apk  # nombre viejo: los enlaces ya compartidos siguen funcionando
          A=android/app/build/outputs/bundle/release/app-release.aab; FILES="$F Mokifit.apk MichiSalud.apk"
          # .aab = el archivo que se sube a Play Console (Play no acepta .apk para apps nuevas)
          if [ -f $A ]; then cp $A Mokifit-PlayStore-v1.${{ github.run_number }}.aab; FILES="$FILES Mokifit-PlayStore-v1.${{ github.run_number }}.aab"; fi
          gh release delete ultima -y --cleanup-tag || true
          gh release create ultima $FILES --latest -t "MokiFit v1.${{ github.run_number }}" -n "APK: descárgalo en tu Android e instálalo. AAB: súbelo a Play Console."
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with: { name: Mokifit-apk, path: Mokifit.apk }
